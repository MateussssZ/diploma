# [LevelDebug = -4 LevelInfo = 0 LevelWarn = 4 LevelError = 8]
Logger:
  Level: 0

GRPCServer:
  Address: "0.0.0.0:8091"
  MaxRecvMsgSize: 8000000
  MaxSendMsgSize: 32000000

RESTServer:
  ListenPort: "8081"
  ReadTimeout: 30s   # increased: pprof CPU profile needs up to 30s window
  WriteTimeout: 30s  # increased: pprof response can be large
  ShutdownTimeout: 5s
  ReadHeaderTimeout: 2s
  IdleTimeout: 30s
  MaxHeaderBytes: 8192
  EnablePprof: true   # set to false in production

AuctionService:
  Address: "localhost:9090"

AuthService:
  SocketPath: "C:/go/src/templateservice/authservice.sock"

Redis:
  Address: "localhost:6379"
  DB: 0
  Password: ""
  MaxRetries: 3
  PoolSize: 100
  DialTimeout: 1s
  ReadTimeout: 500ms
  WriteTimeout: 500ms

CacheConfig:
  AuctionDetailTTL: 10m

Kafka:
  Brokers:
    - "localhost:9092"  # kafka advertised on host via 9092 port mapping
  Topic: "new-bids"    # AuctionService publishes bid events here
  GroupID: "api-gateway"

# WebSocket manager tuning.
# NumActionWorkers: goroutines for blocking gRPC calls (PlaceBid/CreateAuction).
#   Formula: target_bid_rps / (1000 / grpc_p99_ms)
#   Profile via /debug/pprof/goroutine to verify workers aren't saturated.
# NumBroadcastWorkers: goroutines draining broadcastCh.
#   Increase if ws_broadcast_dropped_total rises under sustained load.
WS:
  NumActionWorkers: 4        # adjust after profiling; see formula in config/config.go
  NumBroadcastWorkers: 8
  BroadcastBufSize: 4096
  ActionQueueSize: 1024
  MaxConnections: 50000
