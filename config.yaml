# [LevelDebug = -4 LevelInfo = 0 LevelWarn = 4 LevelError = 8]
Logger:
  Level: 0

GRPCServer:
  Address: "0.0.0.0:8091"
  MaxRecvMsgSize: 8000000
  MaxSendMsgSize: 32000000

RESTServer:
  ListenPort: "8081"
  ReadTimeout: 30s  
  WriteTimeout: 30s  
  ShutdownTimeout: 5s
  ReadHeaderTimeout: 15s 
  IdleTimeout: 30s
  MaxHeaderBytes: 8192
  EnablePprof: true   # set to false in production

AuctionService:
  Address: "localhost:9090"

AuthService:
  SocketPath: "C:/go/src/templateservice/authservice.sock"

Redis:
  Address: "localhost:6379"
  DB: 0
  Password: ""
  MaxRetries: 3
  PoolSize: 100
  DialTimeout: 1s
  ReadTimeout: 500ms
  WriteTimeout: 500ms

CacheConfig:
  AuctionDetailTTL: 10m

Kafka:
  Brokers:
    - "localhost:9093"  
  Topic: "new-bids" 
  GroupID: "api-gateway"

# WebSocket manager tuning.
# NumActionWorkers: goroutines for blocking gRPC calls (PlaceBid/CreateAuction).
# NumBroadcastWorkers: goroutines draining broadcastCh.
WS:
  NumActionWorkers: 64       # было 4 — увеличено для 5000 пользователей: target_bid_rps / (1000 / grpc_p99_ms)
  NumBroadcastWorkers: 8
  BroadcastBufSize: 4096
  ActionQueueSize: 8192      # было 1024 — увеличено пропорционально воркерам
  MaxConnections: 50000
