# Docker-specific config: uses container names instead of localhost
# [LevelDebug = -4 LevelInfo = 0 LevelWarn = 4 LevelError = 8]
Logger:
  Level: 0

GRPCServer:
  Address: "0.0.0.0:8091"
  MaxRecvMsgSize: 8000000
  MaxSendMsgSize: 32000000

RESTServer:
  ListenPort: "8081"
  ReadTimeout: 30s
  WriteTimeout: 30s
  ShutdownTimeout: 5s
  ReadHeaderTimeout: 15s
  IdleTimeout: 30s
  MaxHeaderBytes: 8192
  EnablePprof: true

AuctionService:
  Address: "auction_app:9090"

AuthService:
  SocketPath: "/sockets/authservice.sock"

Redis:
  Address: "diploma_redis:6379"
  DB: 0
  Password: ""
  MaxRetries: 3
  PoolSize: 100
  DialTimeout: 1s
  ReadTimeout: 500ms
  WriteTimeout: 500ms

CacheConfig:
  AuctionDetailTTL: 10m

Kafka:
  Brokers:
    - "auction_kafka:9092"
  Topic: "new-bids"
  GroupID: "api-gateway"

WS:
  NumActionWorkers: 64
  NumBroadcastWorkers: 8
  BroadcastBufSize: 4096
  ActionQueueSize: 8192
  MaxConnections: 50000
